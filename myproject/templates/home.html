{% extends 'base.html' %}


{% block content %}


<h2 style="text-align:center;margin-bottom:30px;">
    Available Products
</h2>


<div class="product-container">


{% for p in products %}


<div class="card">


<img src="{{p.image.url}}" alt="{{p.pro_name}}">


<div class="card-content">


<h3>{{p.pro_name}}</h3>


<p>
Category: {{p.category}}
</p>


<p>
Price: ₹{{p.price}}
</p>


<p>
Stock: {{p.stock}}
</p>


<a href="{% url 'detail' p.id %}" class="btn">
View Details
</a>


</div>


</div>


{% endfor %}


</div>


{% endblock %}
