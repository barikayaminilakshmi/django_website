<!DOCTYPE html>
<html>
<head>
<title>Product Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
}

/* Navigation */

nav{
    background:#222;
    padding:15px 30px;
    display:flex;
    justify-content:center;
    gap:30px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

nav a:hover{
    color:#00bcd4;
}


/* Container */

.container{
    width:90%;
    margin:auto;
    padding:30px;
}


/* Messages */

.success{
    background:#d4edda;
    color:#155724;
    padding:10px;
    border-radius:5px;
    margin-bottom:20px;
}


/* Product Cards */

.product-container{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:25px;

}


/* Card */

.card{

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);

    transition:0.3s;

}


.card:hover{

    transform:translateY(-8px);

}


/* Image */

.card img{

    width:100%;

    height:180px;

    object-fit:contain;
    display:block;
}


/* Content */

.card-content{

    padding:20px;

}


.card h3{

    color:#333;

    margin-bottom:10px;

}


.card p{

    color:#666;

    margin:8px 0;

}


/* Button */

.btn{

    display:inline-block;

    background:#007bff;

    color:white;

    padding:10px 15px;

    border-radius:5px;

    text-decoration:none;

    margin-top:10px;

}


.btn:hover{

    background:#0056b3;

}


/* Mobile Responsive */

@media(max-width:600px){

    nav{

        flex-direction:column;

        align-items:center;

    }


    .container{

        width:100%;

    }

}
/* Admin Table */

.table-container{

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    background:white;

    border-radius:10px;

    overflow:hidden;

}


th{

    background:#222;

    color:white;

    padding:15px;

}


td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid #ddd;

}


tr:hover{

    background:#f5f5f5;

}


td img{

    border-radius:10px;

    object-fit:cover;

}


/* Action Buttons */


.edit-btn{

    background:#28a745;

    color:white;

    padding:8px 12px;

    border-radius:5px;

    text-decoration:none;

}


.delete-btn{

    background:#dc3545;

    color:white;

    padding:8px 12px;

    border-radius:5px;

    text-decoration:none;

}


.edit-btn:hover{

    background:#218838;

}


.delete-btn:hover{

    background:#c82333;

}
/* Form Design */

.form-container{

    width:500px;

    max-width:100%;

    margin:30px auto;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

}


.form-container h2{

    text-align:center;

    margin-bottom:25px;

    color:#333;

}



.form-group{

    margin-bottom:20px;

}


.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}



.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;

}



.form-group input:focus,
.form-group textarea:focus{

    outline:none;

    border-color:#007bff;

}



.submit-btn{

    width:100%;

    background:#007bff;

    color:white;

    padding:12px;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

}


.submit-btn:hover{

    background:#0056b3;

}



.error{

    color:red;

    font-size:14px;

    margin-top:5px;

}



/* Mobile */

@media(max-width:600px){

    .form-container{

        padding:20px;

    }

}
/* Product Details */


.product-details{

    display:flex;

    gap:40px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,0.1);

    margin-top:30px;

}



.details-image{

    flex:1;

}


.details-image img{

    width:100%;

    max-width:400px;

    height:350px;

    object-fit:cover;

    border-radius:15px;

}



.details-content{

    flex:1;

}



.details-content h1{

    color:#333;

    margin-bottom:15px;

}



.details-content h2{

    color:#007bff;

    margin:15px 0;

}



.category{

    color:#777;

    font-size:18px;

}



.details-content p{

    margin:15px 0;

    line-height:1.6;

}


/* Mobile Responsive */

@media(max-width:700px){

    .product-details{

        flex-direction:column;

    }


    .details-image img{

        height:250px;

    }

}
.delete-btn{

    background:#dc3545;

    color:white;

    padding:12px 20px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    margin-right:10px;

}


.delete-btn:hover{

    background:#b02a37;

}
</style>
</head>

<body>

<nav>

<a href="/">User Portal</a>

<a href="/admin-products/">Admin Portal</a>

<a href="/add/">Add Product</a>

</nav>

<div class="container">

{% if messages %}

{% for message in messages %}

<p class="success">{{message}}</p>

{% endfor %}

{% endif %}

{% block content %}

{% endblock %}

</div>

</body>

</html>
