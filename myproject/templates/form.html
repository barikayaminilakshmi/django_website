{% extends 'base.html' %}

{% block content %}

<div class="form-container">

<h2>
    Add / Update Product
</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


{% for field in form %}

<div class="form-group">

<label>
    {{field.label}}
</label>

{{field}}

{% if field.errors %}

<p class="error">
    {{field.errors|striptags}}
</p>

{% endif %}

</div>

{% endfor %}


<button type="submit" class="submit-btn">
    Save Product
</button>


</form>

</div>


{% endblock %}
