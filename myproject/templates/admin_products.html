{% extends 'base.html' %}

{% block content %}

<h2 style="text-align:center;margin-bottom:30px;">
    Manage Products
</h2>


<div style="text-align:right;margin-bottom:20px;">
    <a href="{% url 'add' %}" class="btn">
        + Add Product
    </a>
</div>


<div class="table-container">

<table>

<thead>

<tr>
    <th>Image</th>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Actions</th>
</tr>

</thead>


<tbody>

{% for p in products %}

<tr>

<td>
<img src="{{p.image.url}}" width="70" height="70">
</td>

<td>
{{p.pro_name}}
</td>

<td>
{{p.category}}
</td>

<td>
₹{{p.price}}
</td>

<td>
{{p.stock}}
</td>


<td>

<a href="{% url 'update' p.id %}" class="edit-btn">
Edit
</a>


<a href="{% url 'delete' p.id %}" class="delete-btn">
Delete
</a>


</td>


</tr>

{% endfor %}

</tbody>

</table>

</div>


{% endblock %}
